<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <title>Melis</title>
        <meta name="description" content="Melis è un e-shop di prodotti per la pelle a base di cera d'api: creme idratanti, balsami labbra, scrub e molto altro. I nostri prodotti sono formulati per nutrire e proteggere la pelle, lasciandola morbida, luminosa e sana. Scegli Melis per una skincare naturale e efficace!">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="favicon.ico">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- Navbar -->
        <div class="topBar" id="navbar">
            <div class="opzioni">
                <a href="#">Home</a>
                <a href="#">Prodotti</a>
                <a href="#">Contatti</a>
            </div>
            <div id="menuIcon">
                <img src="./resources/iconSet/menu.svg" alt="Menu" class="menuIcon icon">
            </div>

            <div>
                <picture class="logo">
                    <source 
                        media="(max-width: 600px)"
                        srcset="./resources/imgs/logo/shortLogo.png" alt="Melis">
                    <img src="./resources/imgs/logo/fullLogo.png" alt="Melis" class="logo">
                </picture>
            </div>
            
            <div class="alignEnd">
                <img src="resources/iconSet/shop.svg" alt="Negozio" class="icon">
            </div>
        </div>
        <!-- Contenuto Pagina -->
        <!-- Hero Section -->
        <div class="section pattern sectionPadding">
            <div class="container">
                <video autoplay muted loop class="video">
                    <source src="./resources/video/hero.mp4" type="video/mp4">
                </video>
                <div class="videoOverlay">
                    <h1 class ="mainTitle slideUpFade">Melis</h1>
                    <p class="subtitle slideUpFade delay1"><i>La cosmesi al naturale</i></p>
                    <button class="shopButton slideUpFade delay2">
                        <img src="resources/iconSet/shop.svg" class="icon">
                        <p>Acquista ora</p>
                    </button>
                </div>
            </div>
        </div>
        <!-- nuova linea -->
        <div class="customSection alignCenterText greenSection">
            <div class="container alignCenter">
                <h2 class="secondTitle whiteText">
                    Vitalis
                </h2>
                <p class="subtitle secondSubtitle">
                    Una nuova collezione per ridonare luce e vitalità alla tua pelle
                </p>
                <div class="containerCarosello">
                    <div class="fadeLeft" id="fadeLeft"></div>
                    <div class="fadeRight" id="fadeRight"></div>  
                    <button id="previous" class="buttonCarosello leftButton"><</button>
                    <button id="next" class="buttonCarosello rightButton">></button>
                    <div class="carosello" id="carosello">
                        <div class="card">
                            <img src="./resources/imgs/products/prod1.png" alt="Product image">
                            <div>
                                <p class="quickDescription">
                                    Burrocacao bio
                                </p>
                                <p class="productName">
                                    Vitalis - Burrocacao Bio
                                </p>
                                <p class="productPrice">
                                    10,50
                                </p>
                            </div>
                        </div>
                        <div class="card">
                            
                        </div>
                        <div class="card">
                            
                        </div>
                        <div class="card">
                            
                        </div>
                        <div class="card">
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
